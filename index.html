      { id: 'f-7', name: 'Olivový olej', amount: '500 ml', expiresSoon: false },

    let state = {
      tab: 'recipes', // recipes, fridge, favorites, planner, shopping
      isDark: localStorage.getItem('recepty-theme') === 'dark',
      fridge: JSON.parse(localStorage.getItem('recepty-fridge') || JSON.stringify(DEFAULT_FRIDGE)),
      favorites: JSON.parse(localStorage.getItem('recepty-favs') || JSON.stringify(['r-carbonara', 'r-shakshuka'])),
      shopping: JSON.parse(localStorage.getItem('recepty-shop') || '[]'),
      planner: JSON.parse(localStorage.getItem('recepty-plan') || '[]'),
      selectedRecipe: null,
      portions: 2,
      search: '',
      category: 'all',
      only100: false,
      timerSeconds: 0,
      timerActive: false,
      notes: JSON.parse(localStorage.getItem('recepty-notes') || '{}'),
      ratings: JSON.parse(localStorage.getItem('recepty-ratings') || '{}')
    };

    function saveState() {
      localStorage.setItem('recepty-theme', state.isDark ? 'dark' : 'light');
      localStorage.setItem('recepty-fridge', JSON.stringify(state.fridge));
      localStorage.setItem('recepty-favs', JSON.stringify(state.favorites));
      localStorage.setItem('recepty-shop', JSON.stringify(state.shopping));
      localStorage.setItem('recepty-plan', JSON.stringify(state.planner));
      localStorage.setItem('recepty-notes', JSON.stringify(state.notes));
      localStorage.setItem('recepty-ratings', JSON.stringify(state.ratings));
    }

    function toggleDark() {
      state.isDark = !state.isDark;
      if (state.isDark) document.documentElement.classList.add('dark');
      else document.documentElement.classList.remove('dark');
      saveState();
      render();
    }

    // Inicializace tmavého režimu
    if (state.isDark) document.documentElement.classList.add('dark');

    // Párování surovin
    function norm(t) {
      return (t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
    }

    function matchRecipe(recipe) {
      let have = [];
      let missing = [];
      recipe.ingredients.forEach(ing => {
        const found = state.fridge.find(f => norm(f.name).includes(norm(ing.name)) || norm(ing.name).includes(norm(f.name)));
        if (found) have.push(ing.name);
        else missing.push(ing);
      });
      const score = Math.round((have.length / recipe.ingredients.length) * 100);
      return { recipe, score, have, missing };
    }

    // Minutka
    setInterval(() => {
      if (state.timerActive && state.timerSeconds > 0) {
        state.timerSeconds--;
        const timerEl = document.getElementById('timer-display');
        if (timerEl) {
          const m = Math.floor(state.timerSeconds / 60);
          const s = state.timerSeconds % 60;
          timerEl.innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }
        if (state.timerSeconds === 0) {
          state.timerActive = false;
          alert('Minutka dovařila! Jídlo je hotovo.');
        }
      }
    }, 1000);

          return norm(m.recipe.title).includes(q) || norm(m.recipe.description).includes(q);

    // --- OVLÁDACÍ FUNKCE ---
    function toggleFav(id) {
      if (state.favorites.includes(id)) {
        state.favorites = state.favorites.filter(f => f !== id);
      } else {
        state.favorites.push(id);
      }
      saveState();
      render();
    }

    function openRecipe(id) {
      const r = RECIPES_DB.find(x => x.id === id);
      if (r) {
        state.selectedRecipe = r;
        state.portions = r.portions || 2;
        state.timerSeconds = r.prepTime * 60;
        state.timerActive = false;
        render();
      }
    }

    function startTimer(prepTime) {
      if (state.timerSeconds === 0) state.timerSeconds = prepTime * 60;
      state.timerActive = !state.timerActive;
      render();
    }

    function addFridgeItem(e) {
      e.preventDefault();
      const name = document.getElementById('fridge-name').value;
      const amount = document.getElementById('fridge-amount').value;
      const expiresSoon = document.getElementById('fridge-exp').checked;
      state.fridge.unshift({
        id: 'f-' + Date.now(),
        name,
        amount,
        expiresSoon
      });
      saveState();
      render();
    }

    function removeFridgeItem(id) {
      state.fridge = state.fridge.filter(i => i.id !== id);
      saveState();
      render();
    }

    function addToPlan(recipeId) {
      const r = RECIPES_DB.find(x => x.id === recipeId);
      if (r) {
        state.planner.push({
          id: 'p-' + Date.now(),
          day: 'Pondělí',
          recipeId: r.id,
          title: r.title
        });
        saveState();
        state.tab = 'planner';
        render();
      }
    }

    function removePlanMeal(id) {
      state.planner = state.planner.filter(m => m.id !== id);
      saveState();
      render();
    }

    function generateShoppingFromPlan() {
      state.planner.forEach(m => {
        const rec = RECIPES_DB.find(x => x.id === m.recipeId);
        if (rec) {
          rec.ingredients.forEach(ing => {
            const have = state.fridge.some(f => norm(f.name).includes(norm(ing.name)));
            if (!have && !state.shopping.some(s => norm(s.name) === norm(ing.name))) {
              state.shopping.push({
                id: 's-' + Date.now() + Math.random(),
                name: ing.name,
                checked: false
              });
            }
          });
        }
      });
      saveState();
      state.tab = 'shopping';
      render();
    }

    function addShoppingItem(e) {
      e.preventDefault();
      const val = document.getElementById('shop-name').value;
      state.shopping.push({
        id: 's-' + Date.now(),
        name: val,
        checked: false
      });
      saveState();
      render();
    }

    function toggleShopItem(id) {
      const item = state.shopping.find(i => i.id === id);
      if (item) item.checked = !item.checked;
      saveState();
      render();
    }

    function removeShopItem(id) {
      state.shopping = state.shopping.filter(i => i.id !== id);
      saveState();
      render();
    }

    function moveDoneToFridge() {
      const done = state.shopping.filter(i => i.checked);
      done.forEach(d => {
        state.fridge.push({
          id: 'f-transfer-' + Date.now() + Math.random(),
          name: d.name,
          amount: '1 balení',
          expiresSoon: false
        });
      });
      state.shopping = state.shopping.filter(i => !i.checked);
      saveState();
      state.tab = 'fridge';
      render();
    }

    function addMissingToShop() {
      const match = matchRecipe(state.selectedRecipe);
      match.missing.forEach(m => {
        if (!state.shopping.some(s => norm(s.name) === norm(m.name))) {
          state.shopping.push({
            id: 's-' + Date.now() + Math.random(),
            name: m.name,
            checked: false
          });
        }
      });
      saveState();
      alert('Chybějící suroviny byly přidány do nákupního seznamu!');
      render();
    }

    // Prvotní start
    render();
  </script>
</body>
</html>
